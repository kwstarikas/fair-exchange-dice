name: Sample Test

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Your name'
        required: true
        type: string
      greeting:
        description: 'Greeting to use'
        required: false
        type: string
        default: 'Hello'
      target_env:
        description: 'Target environment'
        required: false
        type: string
        default: 'dev'

jobs:
  echo-test:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Greet
        run: echo "${{ inputs.greeting }}, ${{ inputs.username }}!"

      - name: Step 2 - Show environment
        run: | echo "Running in environment: ${{ inputs.target_env }}"


      - name: Step 3 - Show context
        run: echo "Triggered by ${{ github.actor }} on ${{ github.ref }}"

      - name: Step 4 - Done
        run: echo "Workflow complete."
