name: Dispatch test

  on:
    workflow_dispatch:
      inputs:
        environment:
          description: 'Target environment for the run'
          required: true
          type: choice
          options: [staging, production]
        debug:
          description: 'Enable verbose logging'
          required: false
          type: boolean
          default: false
        notes:
          description: 'Optional free-form notes attached to the run'
          required: false
          type: string

  jobs:
    noop:
      runs-on: ubuntu-latest
      steps:
        - name: Echo inputs
          run: |
            echo "environment=${{ inputs.environment }}"
            echo "debug=${{ inputs.debug }}"
            echo "notes=${{ inputs.notes }}"
